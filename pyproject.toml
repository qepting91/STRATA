[project]
name = "strata"
version = "0.1.0"
description = "STRATA — local-only OT/ICS threat-capability tracking pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "networkx>=3.3",   # graph traversal (strata graph show, handoff-model render)
    "stix2>=3.0",      # STIX 2.1 bundle export
    # Streamlit UI deps: pure-Python, local-only, no CDN/node toolchain --
    # keeps the whole project one dependency tree.
    "streamlit>=1.38",
    "pandas>=2.2",
    "pyvis>=0.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
    "stix2-validator>=3.0",
]

[project.scripts]
strata = "strata.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
