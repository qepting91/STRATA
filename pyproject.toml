[project]
name = "strata"
version = "0.1.0"
description = "STRATA — local-only OT/ICS threat-capability tracking pipeline (Week 1 spine)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    # Week 4 additions (hunt framework + export layer):
    "networkx>=3.3",   # graph-method hunts, H009's traversal, static handoff render
    "jinja2>=3.1",     # report templates (follow-up task)
    "simpleeval>=0.9",  # restricted falsifies_if/insufficient_if evaluation -- never eval()
    "stix2>=3.0",      # STIX 2.1 bundle export
    # Streamlit UI deps (this task): pure-Python, local-only, no CDN/node
    # toolchain -- keeps the whole project one dependency tree.
    "streamlit>=1.38",
    "pandas>=2.2",
    "pyvis>=0.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
    "stix2-validator>=3.0",
]

[project.scripts]
strata = "strata.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
