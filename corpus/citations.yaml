# S-0012's `url` is intentionally null -- unlike every other citation in
# this file, this document was supplied locally by the user (the PDF at
# docs/Dragos-2026-OT-Cybersecurity-Report-A-Year-in-Review.pdf), not
# fetched over HTTPS by any collector, so there is no retrieval URL to
# cite the way a web-sourced citation has one. normalize/corpus.py's
# citation loader (_resolve_source_id) passes `citation.get("url")`
# straight through to store.insert_source, whose `url` parameter is
# already `str | None` (the `source` table's own `url` column is
# nullable per schema.sql) -- a missing/null url here does not break
# corpus loading.
S-0012:
  publisher: Dragos
  url: null
  retrieved: "2026-09-17"
  supports: >
    9th Annual Dragos OT/ICS Cybersecurity Year in Review (Feb 2026).
    Corrects AZURITE and PYROXENE's ICS Kill Chain stage designation
    (both explicitly Stage 2 per the report's own "About" sections, not
    Stage 1 as originally corpus-authored from a thinner web-search
    pass), and confirms Godzilla webshell used by both SYLVANITE (p.27)
    and AZURITE (p.11), and frp (Fast Reverse Proxy) used by both
    SYLVANITE (p.26) and VOLTZITE (already cited to S-0002) -- real,
    primary-source, cross-group tool overlap.

