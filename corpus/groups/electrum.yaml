# ELECTRUM: ICS disruption operator, ICS kill-chain stage 2.
#
# All facts sourced to Dragos's public ELECTRUM page (S-0007). This file
# upgrades the bare stub node that `strata corpus load` created in Week 2
# (referenced only via kamacite.yaml's hands_off_to edge) to a full
# profile. That handoff is declared once, on kamacite.yaml -- it is not
# re-asserted here, to avoid a duplicate edge row.
id: electrum
name: ELECTRUM
naming_org: Dragos
ics_kill_chain_stage: 2
role: ics_disruption_operator

targets:
  sectors: [electric_power_td]
  # S-0007: Ukraine (2015/2016 grid events); "the group is no longer
  # focusing exclusively on Ukraine" and its SANDWORM link implies
  # broader European reach, but no other specific country is named, so
  # only UA is listed as a concrete geo. S-0012's real 2026 report
  # update confirms ELECTRUM's late-December-2025 targeting expanded to
  # Polish energy infrastructure (combined heat and power plants,
  # renewable energy management platforms) -- not yet added as its own
  # geo (PL) here since the report frames this as a single dated
  # incident, not an established/ongoing targeting pattern the way UA
  # is; noted here rather than silently omitted.
  geos: [UA]
  src: S-0007

aliases:
  # Solntsepek: a pro-Russian hacktivist persona (typically associated
  # with doxing) that ELECTRUM has repeatedly co-opted as a deniable
  # front for destructive operations -- this is the third such observed
  # pairing per S-0012. Dragos tracks the persona itself under the
  # activity-cluster id TAT25-41, listed here as `org` since it is
  # Dragos's own internal tracking label, not another firm's competing
  # attribution name (unlike e.g. sylvanite.yaml's UNC5221).
  - name: Solntsepek
    org: "Dragos (tracked as TAT25-41)"
    src: S-0012

tools:
  # CRASHOVERRIDE: the ICS malware used to manipulate electric
  # transmission equipment during the December 2016 Kyiv outage.
  - name: CRASHOVERRIDE
    class: ics_malware
    src: S-0007
  # PathWiper: a destructive wiper (overwrites MBR/NTFS metadata,
  # systematically enumerates and destroys all accessible storage
  # media) first identified by Cisco Talos, appearing in the wild from
  # March 2025. S-0012 states Dragos "has previously linked [it] to
  # ELECTRUM with moderate confidence" -- explicitly not a high-
  # confidence attribution, carried here as-is rather than rounded up.
  - name: PathWiper
    class: wiper
    src: S-0012

techniques:
  # T1584 (Compromise Infrastructure): S-0007 describes using
  # already-compromised MS SQL database servers as the bridge between
  # business and industrial control networks.
  - attack_id: T1584
    matrix: enterprise
    src: S-0007
