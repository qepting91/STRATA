# WASSONITE: espionage/reconnaissance operator, ICS kill-chain stage 1.
#
# All facts sourced to Dragos's public WASSONITE page (S-0029).
id: wassonite
name: WASSONITE
naming_org: Dragos
ics_kill_chain_stage: 1
role: espionage_and_reconnaissance_operator

aliases:
  # S-0029: "third-party security firms associate DTrack and its
  # related malware to the Lazarus Group" -- attributed generically to
  # multiple unnamed third-party firms rather than one, so no `org` is
  # recorded, matching the CyberAv3ngers precedent in bauxite.yaml.
  - name: Lazarus Group
    src: S-0029

targets:
  sectors: [electric, nuclear, manufacturing, space_research]
  geos: [IN, JP, KR]
  src: S-0029

tools:
  - name: DTrack
    class: rat
    src: S-0029
  - name: Mimikatz
    class: credential_theft_tool
    oss: true
    src: S-0029

techniques:
  # T1003 (OS Credential Dumping): S-0029 names Mimikatz for credential
  # capture.
  - attack_id: T1003
    matrix: enterprise
    src: S-0029
