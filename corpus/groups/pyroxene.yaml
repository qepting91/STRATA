# PYROXENE: supply-chain-compromise and social-engineering specialist.
#
# All facts sourced to Dragos's public PYROXENE page (S-0009). No
# specific CVEs are named in that public reporting, so this file has no
# `exploits` list. The handoff from PARISITE is declared once, on
# parisite.yaml -- it is not re-asserted here, to avoid a duplicate edge
# row.
id: pyroxene
name: PYROXENE
naming_org: Dragos
# Corrected from 1 -> 2 this session: the Dragos 2026 OT/ICS
# Cybersecurity Year in Review (S-0012) describes "PYROXENE activity
# aligning with Stage 2 Develop" in its own About section -- a
# stronger primary source than the earlier web-search pass that
# originally authored stage 1 for this file. See azurite.yaml's
# comment for why this is documented inline rather than as a per-field
# `src` (ics_kill_chain_stage has no such field in GroupCorpusEntry).
ics_kill_chain_stage: 2
role: supply_chain_and_social_engineering

# Tortoiseshell: an alias/overlap named in S-0009's own text ("shares
# technical overlaps with APT35, UNC1549, Tortoiseshell adversary
# clusters"), re-confirmed live this session. Assigning org left
# unstated since S-0009 itself doesn't attribute the "Tortoiseshell"
# name to a specific analytic firm the way UNC1549 implies Mandiant.
aliases:
  - name: Tortoiseshell
    src: S-0009

targets:
  sectors: [defense_industrial_base, transportation, aerospace, aviation, maritime, public_admin]
  # S-0009: expanded from the Middle East into North America and
  # Western Europe since 2023; specific countries named for 2024-2025
  # activity are the US, Israel, and the UAE.
  geos: [US, IL, AE]
  src: S-0009

tools:
  # MINIBIKE: a custom RAT named in S-0009. (Independently, MINIBIKE is
  # publicly documented elsewhere as malware associated with the
  # IRGC-linked APT33 cluster, consistent with S-0009's own statement of
  # "extreme technical overlap" with an IRGC-CEC-aligned actor -- cited
  # here to S-0009 only, since that is the source for PYROXENE's use of
  # it specifically.)
  - name: MINIBIKE
    class: rat
    src: S-0009
  # BLUERABBIT: destructive wiper malware, re-confirmed live on S-0009's
  # page this session (re-fetched to enrich this corpus entry, same
  # citation as everything else in this file).
  - name: BLUERABBIT
    class: wiper
    src: S-0009

techniques:
  # T1566 (Phishing): recruitment-themed social engineering per S-0009.
  # T1195 (Supply Chain Compromise): the group's core tradecraft per
  # S-0009's own description.
  - attack_id: T1566
    matrix: enterprise
    src: S-0009
  - attack_id: T1195
    matrix: enterprise
    src: S-0009
