id: H004
title: Web shell / tool choice is group-distinctive
hypothesis: >
  A group's choice of web shell or post-exploitation tool is distinctive
  enough that tool identity alone can support attribution -- no two
  distinct groups in the corpus rely on the same named tool.
rationale: >
  If tool choice is genuinely group-distinctive, tool identity is a cheap,
  reusable attribution signal. If not, tool-based attribution is weaker
  evidence than reports typically imply.
null_hypothesis: >
  At least one tool in the corpus is used by two or more distinct groups,
  or the corpus's uses edges are too few/hand-curated to support either
  conclusion.
method: python
python_fn: h004_webshell_distinctiveness
falsifies_if: "n_tools_shared_across_groups >= 1"
insufficient_if: "n_tools_compared < 20"
telemetry_gap: >
  The corpus's uses edges are hand-curated from each group's own public
  Dragos threat page, one page per group, cited independently -- there
  is no cross-source corroboration step that would surface a tool two
  pages both happen to name. Real data: 17 uses edges across 7-8 groups,
  zero shared. Reporting that as SUPPORTED would overclaim from a small
  hand-curated sample: absence of an observed counterexample in 17 edges
  is not evidence the broader real-world claim holds, especially since
  well-known public reporting elsewhere (e.g. shared web-shell families
  like China-Chopper across multiple unrelated Chinese state clusters)
  directly contradicts strict group-distinctiveness. This is one of the
  two hunts (with H005) most worth leading with in an interview, per the
  spec's own framing: "I expected X, the data said not-X" is the
  strongest signal a hunter can give.
