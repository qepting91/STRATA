id: H008
title: ICS-protocol-native CVE volume is flat while edge CVE volume grows
hypothesis: >
  Year-over-year, the count of CVEs involving an ICS-native protocol
  (Modbus, S7comm, DNP3, etc.) is flat, while the count of CVEs affecting
  Purdue-3.5-classified edge products grows.
rationale: >
  If true, this argues that the growing CVE workload for OT-adjacent
  defenders is concentrated in edge/IT-boundary products, not in
  protocol-native ICS vulnerabilities -- a trend-analysis argument for
  where to grow monitoring capability.
null_hypothesis: >
  There are too few protocol-involving CVEs in the corpus to support any
  year-over-year trend claim at all.
method: python
python_fn: h008_protocol_vs_edge_cve_trend
falsifies_if: "n_protocol_cves >= n_edge_cves"
insufficient_if: "n_protocol_cves < 10"
telemetry_gap: >
  n_protocol_cves is still 3 distinct CVEs (all EtherNet/IP) -- a 3-point
  series cannot support a trend claim in either direction, flat or
  otherwise. Post-Week-4 update: the protocol classifier now also matches
  CSAF advisory product-tree text (attrs.csaf_product_text), not just NVD
  descriptions -- a real code change, not a placeholder. It produced one
  new, correctly-sourced involves edge (cited to its own CSAF advisory
  source_id, not NVD's), but that edge happened to land on a CVE
  (CVE-2026-78012) that already had an NVD-description match, so the
  distinct-CVE count is unchanged at n=3. This is itself informative: the
  CSAF collector only ever samples the 25 most-recent advisory files
  (collect/cisa_csaf.py's N_ADVISORIES constant), so only 77 of 1790 vuln
  nodes carry csaf_product_text at all -- far too small and too recency-
  biased a CSAF sample to expect it to surface many CVEs the (much
  larger, ~1775-CVE) NVD description sweep hadn't already caught. Growing
  n_protocol_cves meaningfully would need either a larger CSAF sample
  (raising N_ADVISORIES, a real collector-scope change) or broader NVD
  keyword coverage, not just this classifier extension alone.
