id: H009
title: Given a Stage 1 handoff, the graph predicts a bounded Stage 2 capability set
hypothesis: >
  Starting from a Stage 1 initial-access group (sylvanite), traversing
  hands_off_to/uses/exploits edges up to 3 hops predicts a bounded,
  non-empty Stage 2 capability set -- the defender-actionable payoff of
  modeling handoffs explicitly instead of treating each group in
  isolation.
rationale: >
  If a defender knows sylvanite is active in their environment, this
  traversal is the concrete answer to "what capability should I assume
  is inbound next," grounded in real, cited hands_off_to/uses/exploits
  edges rather than general reasoning about the actor's reputation.
null_hypothesis: >
  The traversal from sylvanite reaches no other nodes at all within 3
  hops via the declared edge types.
method: graph
graph_op:
  projection:
    node_types: [group, tool, vuln, product]
    edge_types: [hands_off_to, uses, exploits]
  fn: descendants_within
  args:
    source: sylvanite
    depth: 3
    via: [hands_off_to, uses, exploits]
falsifies_if: "n == 0"
insufficient_if: "not source_present"
telemetry_gap: >
  The traversal is only as complete as the corpus's own hands_off_to/
  uses/exploits edges (4/17/5 total respectively) -- it will not surface
  a real-world Stage 2 handoff that no public source has yet named. Real
  result: from sylvanite, hop 1 reaches voltzite (hands_off_to) plus
  sylvanite's own 5 exploited CVEs and 4 used tools (krustyloader,
  warpwire, wirefire, zipline); hop 2 adds exactly one further node --
  voltzite's own tool, frp (voltzite -uses-> frp) -- for 11 reachable
  nodes total at depth 3. No further hops exist beyond that (frp/the
  CVEs/the other tools have no further outbound hands_off_to/uses/
  exploits edges in this corpus), so the traversal terminates naturally
  rather than being artificially depth-capped.
