id: H005
title: Ransomware affecting industrials shows no ICS-native protocol involvement
hypothesis: >
  CVEs flagged for known ransomware-campaign use show essentially zero
  overlap with CVEs that involve an ICS-native protocol (Modbus, S7comm,
  DNP3, etc.) -- ransomware's operational impact on industrials runs
  through IT-side systems (virtualization, file shares), not OT
  protocol-native paths.
rationale: >
  Large-impact ransomware incidents against industrial organizations are
  frequently narrated as "ICS attacks" in press coverage. If the CVEs
  driving those incidents are IT-side, that framing is misleading for
  defenders deciding where to invest OT-specific monitoring.
null_hypothesis: >
  A non-trivial share of ransomware-flagged CVEs also involve an
  ICS-native protocol, or the ransomware-flagged sample is too small to
  say either way.
method: python
python_fn: h005_ransomware_protocol_overlap
falsifies_if: "overlap_rate > 0.05"
insufficient_if: "n_ransomware_cves < 10"
telemetry_gap: >
  known_ransomware_campaign_use is a KEV-sourced field with only two
  observed values ("Known"/"Unknown") and no severity/scope detail; a CVE
  can be flagged "Known" ransomware use while still describing an
  unrelated component. The involves edge only exists at all where the
  protocol classifier matched a CVE description keyword (3 edges total,
  all EtherNet/IP) -- a real but narrow evidentiary base for the "no
  overlap" side too. Still, with 357 ransomware-flagged CVEs and 0 of
  them among the 3 protocol-involving CVEs, this is a real, computable,
  and honestly negative result -- one of the two hunts (with H004) most
  worth leading with in an interview.
