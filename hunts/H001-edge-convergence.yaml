id: H001
title: Edge products targeted by two or more non-overlapping group clusters
hypothesis: >
  Edge products (VPN gateways, firewalls, cellular gateways) targeted by
  two or more distinct threat-actor clusters form a small, stable set
  worth prioritizing for patch/monitoring investment.
rationale: >
  If distinct clusters independently converge on the same edge products,
  that convergence is itself a patch-priority signal, cheaper to compute
  than reasoning about any single actor group in isolation.
null_hypothesis: >
  No product in the graph currently has confirmed exploitation from two
  or more distinct group clusters, or too few exploits edges exist in the
  corpus to ask the question meaningfully at all.
method: sql
query: |
  SELECT
    (SELECT COUNT(*) FROM edge WHERE type = 'exploits') AS total_exploits_edges,
    (SELECT COUNT(*) FROM (
        SELECT affects.dst_id
        FROM edge AS exploits
        JOIN edge AS affects
          ON affects.src_id = exploits.dst_id AND affects.type = 'affects'
        WHERE exploits.type = 'exploits'
        GROUP BY affects.dst_id
        HAVING COUNT(DISTINCT exploits.src_id) >= 2
    )) AS n
falsifies_if: "n == 0"
insufficient_if: "total_exploits_edges < 3"
telemetry_gap: >
  The corpus's exploits edges only exist where a public source explicitly
  names both an actor and a CVE (today, only sylvanite's 5 Ivanti/SAP
  CVEs qualify). Seven of eight corpus groups have no named CVEs at all
  in their public sourcing, so any product they exploit is invisible to
  this hunt even if real-world convergence exists -- this is a
  sourcing-coverage gap, not evidence against convergence.
