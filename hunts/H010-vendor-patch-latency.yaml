id: H010
title: Vendor patch latency for OT-relevant CVEs varies by more than 30 days across vendors
hypothesis: >
  Patch latency (disclosure to vendor fix availability) for OT-relevant
  CVEs varies by more than 30 days across major vendors -- naming names,
  with dates.
rationale: >
  If patch latency varies materially by vendor, that is directly
  actionable procurement/risk-acceptance guidance, distinct from the
  generic "patch faster" advice.
null_hypothesis: >
  No cross-vendor patch-latency comparison can be made because no
  per-vendor disclosure-date data exists in the graph.
method: python
python_fn: h010_vendor_patch_latency
# Method note (post-Week-4 close-out): Siemens ProductCERT and Schneider
# Electric CPCERT are both real, live CSAF PSIRT providers
# (collect/siemens_psirt.py, collect/schneider_psirt.py), giving this hunt
# its first two vendors' real per-vendor disclosure dates
# (advisory.attrs.initial_release_date, cited to that vendor's own
# source.id -- not a fetch timestamp). "Patch latency" is modeled per
# advisory as (vendor's own initial_release_date) minus (that advisory's
# earliest-linked CVE's first known public disclosure, taken as
# min(nvd_published, KEV date_added) over whichever field the CVE's vuln
# node actually has). This is the closest real, computable proxy for
# "time to patch availability" in this graph -- there is no separate
# "vendor fix release date" field independent of the advisory's own
# publish date, and not every CVE has both NVD and KEV dates. See
# hunt/methods.py's h010_vendor_patch_latency for the full derivation.
# insufficient_if requires *both* vendors to have at least one computable
# latency point (n_vendors_with_data == 2) AND the weaker vendor to have
# at least 3 (min_n_per_vendor >= 3) before the comparison is trusted --
# a median over 1-2 data points is a single anecdote, not a vendor
# latency figure. Live run found Siemens n=6 but Schneider n=1 (most of
# this run's advisories are for brand-new 2026 CVEs NVD/KEV haven't yet
# published dates for) -- with only the >=1-per-vendor gate this hunt
# reported SUPPORTED on an n=1 Schneider sample, which overstated its own
# confidence; the >=3 floor below keeps it honestly INSUFFICIENT until
# NVD/KEV catch up in later collection runs and the sample actually grows.
falsifies_if: "median_latency_diff_days < 30"
insufficient_if: "n_vendors_with_data < 2 or min_n_per_vendor < 3"
telemetry_gap: >
  Only 2 of the spec's 7 named vendor PSIRTs are collected
  (siemens-psirt, schneider-psirt) -- Hitachi, Cisco, Palo Alto, Fortinet,
  and Ivanti PSIRT collectors were never built (deliberately deferred
  every prior week; see SOURCES.md), so this comparison is currently
  2-vendor only, not the full cross-vendor picture the hypothesis
  ultimately wants. Live collection (this session) found only 6 Siemens
  and 1 Schneider advisory with a computable latency point (out of 30
  fetched per vendor) -- most fetched advisories are for very recent CVEs
  that NVD/KEV haven't yet published a date for, so both the per-vendor
  and per-vendor-pair sample sizes are currently too small to trust a
  cross-vendor comparison (the >=3-per-vendor floor above is what keeps
  this hunt from overclaiming on that thin a sample). The
  patch_available_at_kev metric (H003) remains a different proxy ("an
  advisory or NVD record existed before KEV listing"), not a per-vendor
  patch-release date, and is not reused here. The latency figure itself
  is also an imperfect proxy: it measures (vendor advisory date) minus
  (CVE's own first public NVD/KEV date), not a true "vulnerability
  reported to vendor" -> "fix shipped" interval, since neither of those
  two true endpoints is directly observable from public CSAF/NVD/KEV data
  alone.
